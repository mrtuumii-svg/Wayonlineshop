# Way Academy — хөгжүүлэлтийн өгөгдлийн сан.
# Нууц үг нь зөвхөн локал хөгжүүлэлтэд. Production-д хэзээ ч эдгээр утгыг хэрэглэхгүй.
services:
  db:
    image: postgres:16-alpine
    container_name: way-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: way
      POSTGRES_PASSWORD: way_dev_only
      POSTGRES_DB: way_dev
    ports:
      - '5432:5432'
    volumes:
      - way-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U way -d way_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Тестийн сан — тест хооронд бүрэн цэвэрлэгддэг тул volume байхгүй (tmpfs).
  db-test:
    image: postgres:16-alpine
    container_name: way-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: way
      POSTGRES_PASSWORD: way_dev_only
      POSTGRES_DB: way_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U way -d way_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API (profile `app`) ──────────────────────────────────────────────
  # `docker compose up -d` нь зөвхөн сангуудыг асаана (тест, локал dev).
  # API-г контейнерээр: `docker compose --profile app up -d --build`
  # Нууцууд root-ийн `.env`-ээс (`.env.example`-ийг харна уу).

  # Migration + seed-ийг нэг удаа ажиллуулаад гарна. Seed нь upsert тул давтахад аюулгүй.
  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://way:way_dev_only@db:5432/way_dev
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run db:seed']
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: way-api
    restart: unless-stopped
    environment:
      # Production-д fake болон QPay sandbox хориотой (сервер эхлэхгүй) — бодит QPay мэдээлэл тавьсны дараа production болгоно
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://way:way_dev_only@db:5432/way_dev
      JWT_SECRET: ${JWT_SECRET:?root .env-д JWT_SECRET тавина уу}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?root .env-д PAYMENT_WEBHOOK_SECRET тавина уу}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      FAKE_PAY_AFTER_MS: 2000
      # Хоосон QPAY_* = sandbox
      QPAY_CLIENT_ID: ${QPAY_CLIENT_ID:-}
      QPAY_CLIENT_SECRET: ${QPAY_CLIENT_SECRET:-}
      QPAY_INVOICE_CODE: ${QPAY_INVOICE_CODE:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # AI туслах — key байхгүй бол /chat 503 буцаана, бусад нь ажиллана
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  way-db-data:
